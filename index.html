<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内お知らせ / ประกาศบริษัท</title>
<style>
  :root{
    --blue:#1f4e8c;
    --blue-light:#e8f0fb;
    --gray:#666;
    --border:#e0e0e0;
    --bg:#f5f6f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Leelawadee UI","Hiragino Kaku Gothic ProN","Noto Sans Thai","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:#222;
  }
  header{
    background:var(--blue);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:13px;
    opacity:.9;
  }
  .lang-toggle{
    display:flex;
    gap:6px;
    margin-top:12px;
  }
  .lang-toggle button{
    flex:1;
    padding:8px 0;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    background:rgba(255,255,255,.18);
    color:#fff;
  }
  .lang-toggle button.active{
    background:#fff;
    color:var(--blue);
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:14px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .card-head{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--border);
  }
  .badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--blue);
    background:var(--blue-light);
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .card-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 4px;
    line-height:1.4;
  }
  .card-date{
    font-size:12px;
    color:var(--gray);
  }
  .card-body{
    padding:12px 16px 16px;
    font-size:14px;
    line-height:1.7;
    color:#333;
    white-space:pre-line;
  }
  .card-actions{
    padding:0 16px 16px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
    text-decoration:none;
    background:var(--blue);
    color:#fff;
  }
  .btn.secondary{
    background:#fff;
    color:var(--blue);
    border:1px solid var(--blue);
  }
  .lang-block{display:none;}
  .lang-block.show{display:block;}
  footer{
    text-align:center;
    font-size:11px;
    color:var(--gray);
    padding:20px 16px 30px;
  }
</style>
</head>
<body>

<header>
  <h1 id="hTitle">社内お知らせボード</h1>
  <p id="hSub">スマートフォンでいつでも確認できます</p>
  <div class="lang-toggle">
    <button id="btnJa" class="active" onclick="setLang('ja')">日本語</button>
    <button id="btnTh" onclick="setLang('th')">ภาษาไทย</button>
  </div>
</header>

<main id="noticeList"></main>

<footer>
  更新: このページのHTMLファイルを編集するだけでお知らせを追加・変更できます。<br>
  QRコードで従業員がすぐに開けます。
</footer>

<script>
// ここにお知らせを追加していくだけで一覧が増えます
const notices = [
  {
    date: "2026.07.31",
    ja: {
      title: "夏期連休前後の品質確認徹底のお願い",
      body: "長期連休前後の品質トラブルを未然防止するため、三現主義(現地・現物・現実)での確認をお願いします。\n連休前: 防錆処理、未加工品・異品混入の防止、工程内の整理整頓\n連休後: 変化点確認、初稼動時の品質・外観確認、作業者への指導\n過去の品質問題の再発防止状況もあわせてご確認ください。\n詳細は添付の資料をご確認ください。"
    },
    th: {
      title: "ขอความร่วมมือตรวจสอบคุณภาพอย่างเข้มงวดก่อน-หลังวันหยุดยาวฤดูร้อน",
      body: "เพื่อป้องกันปัญหาคุณภาพที่อาจเกิดขึ้นก่อนและหลังวันหยุดยาว ขอให้ตรวจสอบตามหลักสถานที่จริง วัตถุจริง สภาพจริง\nก่อนวันหยุด: การป้องกันสนิม การป้องกันชิ้นงานยังไม่แปรรูป/ปนเปื้อนผิดประเภท จัดระเบียบพื้นที่ทำงาน\nหลังวันหยุด: ตรวจสอบจุดเปลี่ยนแปลง ตรวจสอบคุณภาพ/ลักษณะภายนอกช่วงเริ่มเดินเครื่อง และให้คำแนะนำพนักงาน\nขอให้ตรวจสอบสถานะป้องกันการเกิดซ้ำของปัญหาคุณภาพในอดีตด้วย\nรายละเอียดดูได้จากเอกสารที่แนบมา"
    },
    filePdfJa: "夏期連休前後の品質確認（社内）.pdf",
    filePdfTh: "夏期連休前後の品質確認_TH.pdf"
  },
  {
    date: "2026.08.04",
    ja: {
      title: "2026年8月度 浄化槽の定期清掃・点検(第1・第2工場)",
      body: "8月18日(火)9:00〜(第2工場)、13:00〜(第1工場)にて浄化槽の定期清掃・点検を実施します(作業会社: 知立衛生㈱)。\n第1工場玄関前駐車場は車の移動をお願いする場合があります。第2工場玄関前駐車場は作業時間帯の駐車禁止、駐輪場内での整列駐車にご協力ください。\n作業中もトイレの使用は可能です。\n詳細は添付の資料をご確認ください。"
    },
    th: {
      title: "การทำความสะอาดและตรวจสอบถังบำบัดน้ำเสียประจำเดือนสิงหาคม 2026 (โรงงานที่ 1 และ 2)",
      body: "จะมีการทำความสะอาดและตรวจสอบถังบำบัดน้ำเสียในวันอังคารที่ 18 สิงหาคม เวลา 9:00 น. (โรงงานที่ 2) และ 13:00 น. (โรงงานที่ 1) โดยบริษัท จิริว เอเซ จำกัด\nลานจอดรถหน้าโรงงานที่ 1 อาจต้องขอความร่วมมือย้ายรถ ส่วนลานจอดรถหน้าโรงงานที่ 2 ห้ามจอดรถในช่วงเวลาทำงาน กรุณาจอดเรียงในลานจอดรถจักรยาน\nสามารถใช้ห้องน้ำได้ตามปกติระหว่างการทำงาน\nรายละเอียดดูได้จากเอกสารที่แนบมา"
    },
    filePdfJa: "２０２６年８月度 浄化槽の定期清掃・点検（第１・2第２工場）.pdf",
    filePdfTh: "浄化槽の定期清掃・点検_TH.pdf"
  }
];

let lang = "ja";

function setLang(l){
  lang = l;
  document.getElementById("btnJa").classList.toggle("active", l==="ja");
  document.getElementById("btnTh").classList.toggle("active", l==="th");
  document.getElementById("hTitle").textContent = l==="ja" ? "社内お知らせボード" : "บอร์ดประกาศบริษัท";
  document.getElementById("hSub").textContent = l==="ja" ? "スマートフォンでいつでも確認できます" : "ดูได้ทุกที่ทุกเวลาจากสมาร์ทโฟน";
  render();
}

function render(){
  const list = document.getElementById("noticeList");
  list.innerHTML = "";
  notices.forEach(n=>{
    const t = n[lang];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <span class="badge">${n.date}</span>
        <div class="card-title">${t.title}</div>
      </div>
      <div class="card-body">${t.body}</div>
      <div class="card-actions">
        <a class="btn" href="${lang==="ja" ? (n.filePdfJa || n.filePdfTh || n.filePdf) : (n.filePdfTh || n.filePdf)}" target="_blank">${lang==="ja" ? "資料を見る (PDF)" : "เปิดเอกสาร (PDF)"}</a>
                      </div>
    `;
    list.appendChild(card);
  });
}

render();
</script>

</body>
</html>
