<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内お知らせ / ประกาศบริษัท</title>
<style>
  :root{
    --blue:#1f4e8c;
    --blue-light:#e8f0fb;
    --gray:#666;
    --border:#e0e0e0;
    --bg:#f5f6f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Leelawadee UI","Hiragino Kaku Gothic ProN","Noto Sans Thai","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:#222;
  }
  header{
    background:var(--blue);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:13px;
    opacity:.9;
  }
  .lang-toggle{
    display:flex;
    gap:6px;
    margin-top:12px;
  }
  .lang-toggle button{
    flex:1;
    padding:8px 0;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    background:rgba(255,255,255,.18);
    color:#fff;
  }
  .lang-toggle button.active{
    background:#fff;
    color:var(--blue);
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:14px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .card-head{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--border);
  }
  .badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--blue);
    background:var(--blue-light);
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .card-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 4px;
    line-height:1.4;
  }
  .card-date{
    font-size:12px;
    color:var(--gray);
  }
  .card-body{
    padding:12px 16px 16px;
    font-size:14px;
    line-height:1.7;
    color:#333;
    white-space:pre-line;
  }
  .card-actions{
    padding:0 16px 16px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
    text-decoration:none;
    background:var(--blue);
    color:#fff;
  }
  .btn.secondary{
    background:#fff;
    color:var(--blue);
    border:1px solid var(--blue);
  }
  .lang-block{display:none;}
  .lang-block.show{display:block;}
  footer{
    text-align:center;
    font-size:11px;
    color:var(--gray);
    padding:20px 16px 30px;
  }
</style>
</head>
<body>

<header>
  <h1 id="hTitle">社内お知らせボード</h1>
  <p id="hSub">スマートフォンでいつでも確認できます</p>
  <div class="lang-toggle">
    <button id="btnJa" class="active" onclick="setLang('ja')">日本語</button>
    <button id="btnTh" onclick="setLang('th')">ภาษาไทย</button>
  </div>
</header>

<main id="noticeList"></main>

<footer>
  更新: このページのHTMLファイルを編集するだけでお知らせを追加・変更できます。<br>
  QRコードで従業員がすぐに開けます。
</footer>

<script>
// ここにお知らせを追加していくだけで一覧が増えます
const notices = [
  ,
  {
    date: "2026.08.31",
    ja: {
      title: "事業所の飲酒運転根絶 取組強化(アルコールチェック義務化)",
      body: "安全運転管理者による運転者の酒気帯び確認が義務化されています。運転前後は目視等で確認し、記録を1年間保存。アルコール検知器を用いた確認も必須です。\n社用車を運転する際は、必ずアルコール検知器でチェックしてから運転してください。\n詳細は添付の資料をご確認ください。"
    },
    th: {
      title: "มาตรการเข้มงวดขจัดการขับรถขณะเมาสุราของสถานประกอบการ",
      body: "ผู้จัดการด้านความปลอดภัยในการขับขี่มีหน้าที่ตรวจสอบอาการเมาสุราของผู้ขับขี่ก่อนและหลังขับรถ พร้อมบันทึกผลเก็บไว้ 1 ปี และต้องใช้เครื่องตรวจวัดแอลกอฮอล์ในการตรวจสอบด้วย\nก่อนขับรถของบริษัททุกครั้ง กรุณาตรวจสอบด้วยเครื่องตรวจวัดแอลกอฮอล์ก่อนเสมอ\nรายละเอียดดูได้จากเอกสารที่แนบมา"
    },
    filePdfJa: "アルコールチェック警察庁チラシ.pdf",
    filePdfTh: "アルコールチェック_TH.pdf"
  },
  {
    date: "2026.08.31",
    ja: {
      title: "セアカゴケグモ・ハイイロゴケグモにご注意ください",
      body: "毒グモの一種「セアカゴケグモ」「ハイイロゴケグモ」が全国で確認されています。屋外の物陰やすき間、車の下、植木鉢の底などに生息することがあります。\n見つけても素手で触らず、屋外作業の際は手袋を着用してください。咬まれた場合はすみやかに医療機関を受診してください。\n詳細は添付の資料をご確認ください。"
    },
    th: {
      title: "โปรดระวังแมงมุมแม่ม่ายหลังแดงและแมงมุมแม่ม่ายสีเทา",
      body: "พบแมงมุมมีพิษ “แมงมุมแม่ม่ายหลังแดง” และ “แมงมุมแม่ม่ายสีเทา” ทั่วประเทศญี่ปุ่น มักอาศัยตามซอกหลืบกลางแจ้ง ใต้รถยนต์ ใต้กระถางต้นไม้ เป็นต้น\nหากพบเห็นห้ามจับด้วยมือเปล่า และควรสวมถุงมือเมื่อทำงานกลางแจ้ง หากถูกกัดกรุณารีบไปพบแพทย์ทันที\nรายละเอียดดูได้จากเอกสารที่แนบมา"
    },
    filePdfJa: "セアカゴケグモに注意！.pdf",
    filePdfTh: "セアカゴケグモに注意_TH.pdf"
  },
  {
    date: "2026.08.31",
    ja: {
      title: "「ながらスマホ」は法律で禁止されています",
      body: "スマートフォンを使用しながらの運転(自動車・自転車とも)は法律で禁止されており、重大事故につながります。手で持っていなくても画面を注視すること自体が違反です。\n違反した場合は罰則(懲役・罰金)や違反点数が科されます。\n詳細は添付の資料をご確認ください。"
    },
    th: {
      title: "ห้ามใช้สมาร์ทโฟนขณะขับขี่ตามกฎหมาย",
      body: "การใช้สมาร์ทโฟนขณะขับขี่ (ทั้งรถยนต์และจักรยาน) ผิดกฎหมายและอาจนำไปสู่อุบัติเหตุร้ายแรง แม้ไม่ได้ถือด้วยมือ การจ้องมองหน้าจอขณะขับขี่ก็ถือว่าผิดกฎหมายเช่นกัน\nหากฝ่าฝืนจะมีบทลงโทษ (จำคุก/ปรับ) และหักคะแนนใบขับขี่\nรายละเอียดดูได้จากเอกสารที่แนบมา"
    },
    filePdfJa: "ながらスマホ禁止（警視庁）.pdf",
    filePdfTh: "ながらスマホ禁止_TH.pdf"
  }
let lang = "ja";

function setLang(l){
  lang = l;
  document.getElementById("btnJa").classList.toggle("active", l==="ja");
  document.getElementById("btnTh").classList.toggle("active", l==="th");
  document.getElementById("hTitle").textContent = l==="ja" ? "社内お知らせボード" : "บอร์ดประกาศบริษัท";
  document.getElementById("hSub").textContent = l==="ja" ? "スマートフォンでいつでも確認できます" : "ดูได้ทุกที่ทุกเวลาจากสมาร์ทโฟน";
  render();
}

function render(){
  const list = document.getElementById("noticeList");
  list.innerHTML = "";
  notices.forEach(n=>{
    const t = n[lang];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <span class="badge">${n.date}</span>
        <div class="card-title">${t.title}</div>
      </div>
      <div class="card-body">${t.body}</div>
      <div class="card-actions">
        <a class="btn" href="${lang==="ja" ? (n.filePdfJa || n.filePdfTh || n.filePdf) : (n.filePdfTh || n.filePdf)}" target="_blank">${lang==="ja" ? "資料を見る (PDF)" : "เปิดเอกสาร (PDF)"}</a>
                      </div>
    `;
    list.appendChild(card);
  });
}

render();
</script>

</body>
</html>
